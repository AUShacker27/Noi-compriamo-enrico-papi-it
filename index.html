<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrico Papi Mystery</title>
    <style>
        /* Sfondo completamente nero e centraggio assoluto */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Schermata iniziale con la domanda e il pulsante */
        .quiz-container {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Il pulsante giallo richiesto */
        .btn-giallo {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0px 0px 20px rgba(255, 204, 0, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-giallo:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 30px rgba(255, 204, 0, 0.9);
        }

        /* Contenitore del video (nascosto all'inizio) */
        .video-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        /* Stile verticale tipo TikTok/Shorts per il video locale */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Schermata Principale -->
    <div class="quiz-container" id="quizScreen">
        <h1>Cosa vorrà mai Enrico papi?</h1>
        <button class="btn-giallo" id="discoverBtn">Scoprilo</button>
    </div>

    <!-- Schermata Video in Loop -->
    <div class="video-container" id="videoScreen">
        <!-- Motore sbloccato per riprodurre il tuo file video offline in loop continuo -->
        <video id="papiVideo" loop playsinline>
            <source src="video.mp4" type="video/mp4">
            Il tuo browser non supporta questo video.
        </video>
    </div>

    <script>
        const quizScreen = document.getElementById('quizScreen');
        const videoScreen = document.getElementById('videoScreen');
        const discoverBtn = document.getElementById('discoverBtn');
        const papiVideo = document.getElementById('papiVideo');

        discoverBtn.addEventListener('click', () => {
            // Nasconde la domanda e il pulsante giallo
            quizScreen.style.display = 'none';
            
            // Mostra lo schermo del video a tutto schermo
            videoScreen.style.display = 'block';
            
            // Avvia la riproduzione del tuo file offline
            papiVideo.play().catch(error => {
                console.log("Autoplay con audio bloccato, riprovo in modalità muto:", error);
                // Soluzione automatica se lo smartphone richiede il muto all'avvio improvviso
                papiVideo.muted = true;
                papiVideo.play();
            });
        });
    </script>
</body>
</html>
